<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Dashboard</title>
    <link
      rel="shortcut icon"
      href="/android-chrome-512x512.png"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <link rel="stylesheet" href="style.css" />
  <body>
    <div id="main">
      <nav>
        <div class="nav-in">
          <h2>Productivity DashBoard</h2>
          <div class="theme">
            <h4>Change Theme</h4>
          </div>
        </div>
      </nav>
      <section class="allElems">
        <header>
          <div class="header1">
            <h2>20 April 2026</h2>
            <h1>Saturday ,1:00 PM</h1>
            <h4>Basti (UP)</h4>
          </div>

          <div class="header2">
            <h2>20°C</h2>
            <h4>light Rain</h4>
            <h3 class="precipitation">Precipitation:35%</h3>
            <h3 class="humidity">Humidity:49%</h3>
            <h3 class="wind">Wind:10km/h</h3>
          </div>
        </header>
        <div class="allFeatures">
          <div class="todo elem" id="0">
            <img
              src="https://plus.unsplash.com/premium_vector-1761412865654-d8d081559fbc?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bWluaW1hbCUyMGNoZWNrbGlzdCUyMDNkfGVufDB8fDB8fHww"
              alt=""
            />
            <h2>Tasks</h2>
          </div>
          <div class="Daily elem" id="1">
            <img
              src="https://images.unsplash.com/photo-1719090024525-667c8fcf5bb9?q=80&w=1228&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              alt=""
            />
            <h2>Planner</h2>
          </div>
          <div class="Motivational elem" id="2">
            <img
              src="https://plus.unsplash.com/premium_vector-1752131221539-4904bec36106?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              alt=""
            />
            <h2>Inspire</h2>
          </div>
          <div class="Pomo elem" id="3">
            <img
              src="https://images.unsplash.com/photo-1698428828703-e5376169deb0?q=80&w=1332&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3Dz"
              alt=""
            />
            <h2>Pomodoro</h2>
          </div>
          <div class="Dailyg elem" id="4">
            <img
              src="https://plus.unsplash.com/premium_photo-1673890230341-99a9424ff847?q=80&w=627&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              alt=""
            />
            <h2>Goals</h2>
          </div>
        </div>
      </section>

      <section class="fullElem todo-list-fullpage">
        <button class="back" id="0">Close</button>
        <h2>Vision</h2>

        <div class="todo-container">
          <div class="addTask">
            <form>
              <input id="task-input" type="text" placeholder="Enter Tasks" />
              <textarea
                placeholder="Enter Details"
                id=""
                cols="30"
                rows="10"
              ></textarea>
              <div class="mark-imp">
                <input type="checkbox" id="check" />
                <label for="check">Mark as Important!</label>
              </div>
              <button>Add Task</button>
            </form>
          </div>

          <div class="allTask"></div>
        </div>
      </section>

      <section class="fullElem Daily-planner-fullpage">
        <button class="back" id="1">Close</button>
        <h2>Agenda</h2>

        <div class="day-planner"></div>
      </section>

      <section class="fullElem motivational-fullpage">
        <button class="back" id="2">Close</button>
        <h2>Quotes</h2>
        <div class="motivation-full-page-container">
          <div class="motivation-container">
            <div class="motivation-wrapper">
              <img src="./quotes.png" alt="" />
              <div class="motivation-1">
                <!-- <h2>Quotes of the day</h2> -->
              </div>
              <div class="motivation-2">
                <h1></h1>
              </div>
              <div class="motivation-3">
                <h2></h2>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="fullElem Pomodoro-fullpage">
        <button class="back" id="3">Close</button>
        <h2>Deep Work</h2>
        <h4 class="session">Work Session</h4>
        <div class="pomo-timer">
          <h1>25:00</h1>
          <button class="start-timer">Start</button>
          <button class="pause-timer">Pause</button>
          <button class="reset-timer">Reset</button>
        </div>
      </section>

      <section class="fullElem Daily-goals-fullpage">
        <button class="back" id="4">Close</button>

        <h1>Milestones</h1>

        <div class="goal-container">
          <form class="goal-form">
            <input
              type="text"
              class="goal-input"
              placeholder="Enter The Goals..."
            />
            <button>Add Goal</button>
          </form>

          <div class="allGoals"></div>
        </div>
      </section>
    </div>
  </body>
  <script src="Script.js"></script>
</html>
